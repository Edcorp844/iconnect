[package]
edition = "2021"
name = "iconnect"
version = "0.1.0"

[dependencies]
adw = {version = "0.8.1", package = "libadwaita", features = ["v1_9"]}
anyhow = "1.0.104"
chrono = "0.4.45"
futures-util = "0.3.34"
gettext-rs = {version = "0.7.7", features = ["gettext-system"]}
gtk = {version = "0.10.3", package = "gtk4", features = ["v4_12"]}
pangocairo = "0.22.9"
relm4 = {version = "0.10.1", features = ["macros", "libadwaita"]}
serde = { version = "1.0.229", features = ["serde_derive"] }
serde_json = "1.0.151"
tokio = {version = "1.53.2", features = ["rt-multi-thread", "macros"]}
zbus = {version = "5.19.0", features = ["tokio"]}
